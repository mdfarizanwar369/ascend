apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

import java.util.Properties

def firebaseApiKey = System.getenv("CAPACITOR_ANDROID_FIREBASE_API_KEY") ?: "AIzaSyAPt_jd-q2d5on4Bv9VS6XqE-ffzGpjgmg"
def firebaseAppId = System.getenv("CAPACITOR_ANDROID_FIREBASE_APP_ID") ?: "1:790770085471:web:416d3fae44ab1ddf2b75ea"
def firebaseProjectId = System.getenv("CAPACITOR_ANDROID_FIREBASE_PROJECT_ID") ?: "ascend-b2850"
def firebaseSenderId = System.getenv("CAPACITOR_ANDROID_FIREBASE_MESSAGING_SENDER_ID") ?: "790770085471"
def firebaseStorageBucket = System.getenv("CAPACITOR_ANDROID_FIREBASE_STORAGE_BUCKET") ?: "ascend-b2850.firebasestorage.app"
def googleWebClientId = System.getenv("CAPACITOR_ANDROID_GOOGLE_WEB_CLIENT_ID") ?: "790770085471-9g0epif2n7hv5oveasimsg8kqai9kell.apps.googleusercontent.com"
def androidVersionCode = (System.getenv("ASCEND_ANDROID_VERSION_CODE") ?: "10") as Integer
def androidVersionName = System.getenv("ASCEND_ANDROID_VERSION_NAME") ?: "0.1.2"
def googleServicesFile = file('google-services.json')
def hasGoogleServices = googleServicesFile.exists() && googleServicesFile.text?.trim()

def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file("signing.properties")
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { stream ->
        signingProperties.load(stream)
    }
}

def signingStoreFile = System.getenv("ASCEND_ANDROID_KEYSTORE_PATH") ?: signingProperties.getProperty("STORE_FILE")
def signingStorePassword = System.getenv("ASCEND_ANDROID_KEYSTORE_PASSWORD") ?: signingProperties.getProperty("STORE_PASSWORD")
def signingKeyAlias = System.getenv("ASCEND_ANDROID_KEY_ALIAS") ?: signingProperties.getProperty("KEY_ALIAS")
def signingKeyPassword = System.getenv("ASCEND_ANDROID_KEY_PASSWORD") ?: signingProperties.getProperty("KEY_PASSWORD")
def hasReleaseSigning = [signingStoreFile, signingStorePassword, signingKeyAlias, signingKeyPassword].every { it?.trim() }
def resolveSigningStoreFile = { String storePath ->
    if (!storePath) {
        return null
    }

    def directFile = new File(storePath)
    if (directFile.isAbsolute()) {
        return directFile
    }

    def projectRelative = rootProject.file(storePath)
    if (projectRelative.exists()) {
        return projectRelative
    }

    if (storePath.startsWith("android/") || storePath.startsWith("android\\")) {
        def trimmed = storePath.replaceFirst(/^android[\/\\]/, "")
        def trimmedRelative = rootProject.file(trimmed)
        if (trimmedRelative.exists()) {
            return trimmedRelative
        }
    }

    return projectRelative
}
def resolvedSigningStoreFile = hasReleaseSigning ? resolveSigningStoreFile(signingStoreFile) : null

android {
    namespace = "fit.getascend.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "fit.getascend.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode androidVersionCode
        versionName androidVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        if (!hasGoogleServices) {
            resValue "string", "google_api_key", firebaseApiKey
            resValue "string", "google_crash_reporting_api_key", firebaseApiKey
            resValue "string", "google_app_id", firebaseAppId
            resValue "string", "project_id", firebaseProjectId
            resValue "string", "gcm_defaultSenderId", firebaseSenderId
            resValue "string", "google_storage_bucket", firebaseStorageBucket
            resValue "string", "default_web_client_id", googleWebClientId
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile resolvedSigningStoreFile
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing true
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.health.connect:connect-client:$healthConnectVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$kotlinxCoroutinesVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

if (hasGoogleServices) {
    apply plugin: 'com.google.gms.google-services'
} else {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

tasks.configureEach { task ->
    if ((task.name == "bundleRelease" || task.name == "assembleRelease") && !hasReleaseSigning) {
        task.doFirst {
            throw new GradleException(
                "Release signing is not configured. Add android/signing.properties or set ASCEND_ANDROID_KEYSTORE_PATH, " +
                "ASCEND_ANDROID_KEYSTORE_PASSWORD, ASCEND_ANDROID_KEY_ALIAS, and ASCEND_ANDROID_KEY_PASSWORD."
            )
        }
    }
}
