<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Ascend</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #07090d;
        --panel: #101723;
        --line: rgba(113, 128, 150, 0.22);
        --text: #f6f8fb;
        --muted: #a8b0bf;
        --teal: #3de6d1;
        --purple: #8b5cf6;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top, rgba(61, 230, 209, 0.18), transparent 36%),
          radial-gradient(circle at 80% 20%, rgba(139, 92, 246, 0.2), transparent 28%),
          var(--bg);
      }
      .card {
        width: min(100%, 420px);
        border: 1px solid var(--line);
        background: rgba(16, 23, 35, 0.92);
        border-radius: 24px;
        padding: 28px;
        text-align: center;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      }
      .mark {
        width: 88px;
        height: 88px;
        margin: 0 auto;
        border-radius: 26px;
        display: grid;
        place-items: center;
        font-size: 44px;
        font-weight: 800;
        color: white;
        background: linear-gradient(135deg, rgba(139, 92, 246, 0.95), rgba(61, 230, 209, 0.95));
      }
      h1 {
        margin: 18px 0 10px;
        font-size: 28px;
        line-height: 1.1;
      }
      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.7;
      }
      .pill {
        display: inline-block;
        margin-top: 18px;
        padding: 10px 16px;
        border-radius: 999px;
        background: linear-gradient(90deg, rgba(139, 92, 246, 0.2), rgba(61, 230, 209, 0.2));
        color: var(--teal);
        font-weight: 600;
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark">A</div>
      <h1>Opening Ascend</h1>
      <p>Your Android shell is ready. If the live app does not appear in a moment, check your internet connection and reopen Ascend.</p>
      <span class="pill">Accountability between sessions</span>
    </main>
  </body>
</html>
