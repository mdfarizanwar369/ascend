appId: fit.getascend.app
---
- launchApp
- extendedWaitUntil:
    visible: "Create account"
    timeout: 60000
- scrollUntilVisible:
    element: "Already have an account\\? Log in"
    direction: DOWN
    timeout: 60000
- tapOn: "Already have an account\\? Log in"
- scrollUntilVisible:
    element: "you@example.com"
    direction: UP
    timeout: 60000
- extendedWaitUntil:
    visible: "you@example.com"
    timeout: 60000
- tapOn: "you@example.com"
- inputText: ${REVIEW_EMAIL}
- scrollUntilVisible:
    element: "Password"
    direction: DOWN
    timeout: 30000
- tapOn: "Password"
- inputText: ${REVIEW_PASSWORD}
- tapOn:
    point: "97%,97%"
    retryTapIfNoChange: true
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Log in"
    direction: DOWN
    timeout: 30000
- tapOn:
    text: "Log in"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "(?i).*essentials.*"
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: 01-dashboard
- scroll
- waitForAnimationToEnd
- takeScreenshot: 02-daily-tracking
