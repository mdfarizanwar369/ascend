name: iOS subscription review screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        plan: [premium, trainer]
    runs-on: macos-26
    timeout-minutes: 30
    environment: apple-testflight
    env:
      SCREENSHOT_DEVICE: iphone
      CAPTURE_PLAN: ${{ matrix.plan }}
      IOS_GOOGLE_SERVICE_INFO_BASE64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ios:prepare
      - run: python3 scripts/prepare-ios-screenshot-driver.py
      - name: Build simulator for actual service screenshots
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ios-derived" CODE_SIGNING_ALLOWED=NO build \
            > "$RUNNER_TEMP/ios-screenshot-build.log" 2>&1
      - name: Capture subscription service with fictional review account
        env:
          IOS_SUBSCRIPTION_REVIEW_ACCOUNTS: ${{ secrets.IOS_SUBSCRIPTION_REVIEW_ACCOUNTS }}
        run: python3 scripts/ios-subscription-review-screenshots.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Ascend-subscription-review-${{ matrix.plan }}
          path: ${{ runner.temp }}/store-screenshots/**/*.png
          if-no-files-found: warn
          retention-days: 7
