name: iOS build

on:
  pull_request:
    paths:
      - 'ios/**'
      - 'scripts/ios-*'
      - 'scripts/generate-ios-*'
      - 'capacitor.config.ts'
      - 'package*.json'
      - 'mobile-shell/**'
      - 'mobile-shell-ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
    inputs:
      check_health_release:
        description: Read-only Apple Health release and signing preflight
        type: boolean
        default: false
      upload_testflight:
        description: Sign and upload to TestFlight (requires configured Apple secrets)
        type: boolean
        default: false
      check_testflight:
        description: Check build processing and tester group assignment
        type: boolean
        default: false
      build_number:
        description: Build number to check
        type: string
        default: '66.1'
      assign_internal_build:
        description: Assign the selected build to the existing two-tester Ascend Internal group
        type: boolean
        default: false
      assign_owner_build:
        description: Assign the valid build only to the App Store Connect account holder
        type: boolean
        default: false
      assign_owner_group_build:
        description: Assign the valid build to a verified one-person Ascend Owner internal group
        type: boolean
        default: false
      resend_owner_invite:
        description: Resend the selected internal build's invitation to the account holder
        type: boolean
        default: false

permissions:
  contents: read

env:
  # The payment beta uses its own server and database while 1.0 remains in review.
  CAPACITOR_IOS_SERVER_URL: ${{ github.ref == 'refs/heads/codex/ios-subscriptions-1-1' && 'https://ascend-ios-payments-web-ascend-ios-payments.up.railway.app/launch' || 'https://www.getascend.fit/launch' }}

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  health-release-preflight:
    if: github.event_name == 'workflow_dispatch' && inputs.check_health_release && github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 5
    environment: apple-testflight
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyJWT[crypto]==2.10.1'
      - name: Read Apple release and HealthKit signing status
        env:
          IOS_PROFILE_BASE64: ${{ secrets.IOS_APPLE_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: python scripts/apple-health-release-check.py
  testflight-status:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.check_testflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: apple-testflight
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyJWT[crypto]==2.10.1'
      - name: Read TestFlight status
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          ASC_BUILD_NUMBER: ${{ inputs.build_number }}
          ASC_ASSIGN_INTERNAL_BUILD: ${{ inputs.assign_internal_build }}
          ASC_ASSIGN_OWNER_BUILD: ${{ inputs.assign_owner_build }}
          ASC_ASSIGN_OWNER_GROUP_BUILD: ${{ inputs.assign_owner_group_build }}
          ASC_RESEND_OWNER_INVITE: ${{ inputs.resend_owner_invite }}
        run: python scripts/testflight_status.py

  simulator:
    if: github.event_name == 'pull_request' || (!inputs.check_testflight && !inputs.check_health_release) || inputs.upload_testflight
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 -m unittest discover -s scripts -p test_ios_release.py
      - run: npm run ios:prepare
      - run: npm run ios:check
      - name: Validate Xcode metadata
        run: |
          xcodebuild -version
          plutil -lint ios/App/App/Info.plist ios/App/App/PrivacyInfo.xcprivacy ios/App/App.xcodeproj/project.pbxproj
      - name: Build iOS simulator app
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ios-derived" CODE_SIGNING_ALLOWED=NO build \
            | tee "$RUNNER_TEMP/ios-build.log"
      - name: Package simulator app
        run: ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/ios-derived/Build/Products/Debug-iphonesimulator/App.app" "$RUNNER_TEMP/Ascend-simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Ascend-iOS-simulator
          path: ${{ runner.temp }}/Ascend-simulator.zip
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: iOS-build-log
          path: ${{ runner.temp }}/ios-build.log
          retention-days: 7

  testflight:
    if: github.event_name == 'workflow_dispatch' && inputs.upload_testflight && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/ios-subscriptions-1-1' || github.ref == 'refs/heads/codex/ios-1.2-public-trainer-pro')
    needs: simulator
    runs-on: macos-26
    timeout-minutes: 40
    environment: apple-testflight
    env:
      IOS_GOOGLE_SERVICE_INFO_BASE64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ios:prepare
      - name: Sign and upload to TestFlight
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_APPLE_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: python3 scripts/ios-release.py
