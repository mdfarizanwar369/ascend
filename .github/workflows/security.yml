name: Security and quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ascend_test
          POSTGRES_PASSWORD: local-test-fixture
          POSTGRES_DB: ascend_hardening_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare isolated concurrency database
        run: |
          npm run build --workspace shared
          npm run db:migrate --workspace backend
          node backend/scripts/prepare-hardening-test-db.cjs
        env:
          DATABASE_URL: postgres://ascend_test:local-test-fixture@127.0.0.1:5432/ascend_hardening_test
      - run: npm run lint
      - run: npm test
        env:
          ASCEND_HARDENING_TEST_DATABASE_URL: postgres://ascend_app_runtime:local-test-fixture@127.0.0.1:5432/ascend_hardening_test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
